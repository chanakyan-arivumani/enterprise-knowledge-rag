[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6,<0.7",
    "PyMuPDF",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
